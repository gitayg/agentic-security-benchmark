name: validate

# The gate on every corpus change: the samples must be well-formed, uniquely identified,
# inside their corpus's id namespace, justified by a validity statement, free of credential-shaped
# strings, and free of any leak from a locked held-out split. It also fails if a published
# results/ file names a sample id that no longer exists.
#
# This workflow deliberately needs no secrets and no network access beyond checkout and the
# Node setup. The validator has zero dependencies and never installs anything, so a corpus PR
# from a fork cannot execute third-party code in CI.
#
# WHAT IT DOES NOT COVER, so nobody mistakes a green tick for more than it is:
#   * the .github/ISSUE_TEMPLATE/*.yml issue forms. They are not checked here at all — not even
#     parsed. They were validated out-of-band against GitHub's published form schema (see
#     CONTRIBUTING.md); a syntax error in one of them would show up as a broken form on GitHub,
#     not as a red run here.
#   * the `moorai` reference adapter, which needs a MoorAI checkout this workflow does not have.
#     Only the dependency-free `keyword` adapter is exercised.
#   * any score. See the smoke-run comment below.
#
# EVERY STEP HERE HAS BEEN RUN LOCALLY AND SEEN FAIL. Each check was falsified against a
# deliberately-broken corpus copy (BENCHMARK_CORPORA_DIR) before this comment was written:
# a bad harness value, a missing shouldDetect, a duplicate id, an out-of-namespace id, an
# unregistered corpus file, an unparseable file, a planted xoxb- token, a split:"test" leak, a
# stale results id, a malformed adapter finding and a missing corpus file all exit non-zero.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: corpus integrity + harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # MEASURED, NOT ASSUMED: on Node 22 `node --test test/` does NOT work — the runner tries to
      # resolve the directory as a module and dies with MODULE_NOT_FOUND before any test runs.
      # Bare `node --test` applies Node's default test-file discovery (which matches
      # test/validate-corpora.mjs) and is the form that actually runs the suite. Do not "tidy"
      # this back into a directory argument without re-checking it on the pinned Node version.
      - name: Corpus integrity (node:test, zero dependencies)
        run: node --test

      # Smoke run of the scoring harness against the built-in keyword adapter. This asserts the
      # harness still starts, loads every corpus and produces JSON — it pins no score, because a
      # workflow that asserts "recall >= X" turns every adapter change into a spurious failure
      # while proving nothing.
      - name: Harness smoke run
        run: node scorers/run.mjs --adapter keyword --corpus all --json > /dev/null
